[package]
name = "myid"
version = "0.1.1"
authors = ["Diyorbek Abdumutalibov", "<diordev@icloud.com>"]
edition = "2024"
rust-version = "1.93.0"
description = "Rust client library for MyID SDK API — user identification and verification"
documentation = "https://docs.rs/myid"
readme = "README.md"
repository = "https://github.com/diordev/myid.git"
license = "MIT OR Apache-2.0"
keywords = ["myid","auth","faceid","identification", "uzbekistan"]
include = [
    "README.md",
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "src/**/*.rs",
    "examples/",
    ".env.example"
]

[dependencies]
thiserror = "2"
url = "2"
