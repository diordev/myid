[[bin]]
name = "myid"
path = "src/main.rs"

[package]
name = "myid"
version = "0.1.0"
edition = "2024"
description = "Rust client library for MyID SDK API — user identification and verification"
readme = "README.md"
license = "MIT"
repository = "https://github.com/diordev/myid.git"
keywords = ["myid","auth", "faceid", "kyc", "identification", "uzbekistan"]
rust-version = "1.93.0"
exclude = ["/ci", "images/", ".*", "/Makefile"]
include = ["/.env.example"]

[dependencies]
